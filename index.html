<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI French Poem Generator</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI French Poem Generator</h1>
      </header>

      <main>
        <form action="">
          <input
            type="text"
            placeholder="Enter the topic of the French poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="poem">
          La tombe dit à la rose
          <br />
          Des pleurs dont l'aube t'arrose
        </div>
      </main>

      <footer>
        This AI project was coded by
        <a href="https://github.com/linn-nay-chi-hlaing" target="_blank"
          >Linn Nay Chi Hlaing</a
        >
        and is
        <a
          href="https://github.com/linn-nay-chi-hlaing/SheCodes-Plus-AI-Week-2-LESSON-2"
          target="_blank"
          >open-sourced on GitHub</a
        >
        and is
        <a
          href="https://lnch-shecodes-plus-ai-week2-lesson2.netlify.app/"
          target="_blank"
        >
          hosted on Netlify</a
        >
        .
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
